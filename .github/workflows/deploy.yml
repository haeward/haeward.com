name: Site Build And Deploy

on:
  schedule:
    # Daily 00:05 UTC rebuild; Blogroll gets a new order each day.
    - cron: '5 0 * * *'
  workflow_call:
    inputs:
      reuse-build:
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: site-build-and-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download checked build
        if: inputs.reuse-build
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist/

      - name: Install Playwright browser
        if: ${{ !inputs.reuse-build }}
        run: pnpm run smoke:install

      - name: Build site
        if: ${{ !inputs.reuse-build }}
        run: pnpm run build

      - name: Content integrity checks
        if: ${{ !inputs.reuse-build }}
        run: pnpm run check:content

      - name: Core smoke check
        if: ${{ !inputs.reuse-build }}
        run: pnpm run smoke:quick

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=blog --commit-dirty=true
          wranglerVersion: '4.162.0'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-smoke-failure
          path: output/playwright/smoke/chromium/
          if-no-files-found: ignore
          retention-days: 7
