name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      site: ${{ steps.changes.outputs.site }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Classify changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          site=true
          if [ -n "$BASE" ] && git fetch --depth=1 origin "$BASE"; then
            if git diff --name-only "$BASE" HEAD | node scripts/verify/docs-only.mjs; then
              site=false
            fi
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Biome check
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.changes.outputs.site == 'true' }}
        run: pnpm run check

      - name: Markdown lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run md:lint

      - name: Secret lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run secrets:lint

      - name: Build site and search
        if: steps.changes.outputs.site == 'true'
        run: pnpm run build

      - name: Content integrity checks
        if: steps.changes.outputs.site == 'true'
        run: pnpm run check:content

      - name: Core smoke check
        if: steps.changes.outputs.site == 'true'
        env:
          SMOKE_BROWSER_CHANNEL: chrome
        run: pnpm run smoke

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-failure-chromium
          path: output/playwright/smoke/chromium/
          if-no-files-found: ignore
          retention-days: 7

      - name: Share the checked build
        if: steps.changes.outputs.site == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.checks.outputs.site == 'true'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    with:
      reuse-build: true
    secrets: inherit
