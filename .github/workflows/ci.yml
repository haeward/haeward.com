name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm run check

      - name: Markdown lint
        run: pnpm run md:lint

      - name: Secret lint
        run: pnpm run secrets:lint

      - name: Data and failure regression checks
        run: pnpm run test:data

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Full site and search build
        run: pnpm run build

      - name: Content integrity checks
        run: pnpm run check:content

      - name: Chromium regression checks
        run: node scripts/verify/smoke.mjs

      - name: WebKit regression checks
        run: node scripts/verify/smoke.mjs
        env:
          SMOKE_BROWSER: webkit
