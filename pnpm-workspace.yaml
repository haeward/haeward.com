minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

packageExtensions:
    # astro2tsx pins @emnapi/core and needs the matching runtime for its WASM loader.
    "@astrojs/astro2tsx@0.1.3":
        dependencies:
            "@emnapi/runtime": 1.11.3

overrides:
    "@tailwindcss/typography>postcss-selector-parser": 7.2.1
    fast-xml-parser: 5.12.1
    lodash: 4.18.1
    "markdownlint>re2js": 2.10.0
    "micromark-extension-math>katex": 0.19.1

allowBuilds:
    esbuild: true
    sharp: true
    workerd: true
